<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#052049">
  <meta http-equiv="Permissions-Policy" content="interest-cohort=()" />
  <!-- Preconnect to external domains for faster resource loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <!-- Preload critical CSS -->
  <link rel="preload" href="/static/css/bootstrap.min.css" as="style">
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link href="/static/css/custom.css" rel="stylesheet">
</head>

<body>

  <!-- Static navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #052049">
    <a class="navbar-brand" href="/">{{site.name}}</a>
    <!-- Add part of website (opsional) -->
    <!-- <a href="https://ftsl.itb.ac.id/" rel="noopener"><img class="inline-block navb-icon" -->
    <!-- src="/static/img/logo/logo-ftsl-1.png" alt="Fakultas Teknik Sipil dan Lingkungan logo"></a> -->
    <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarContent"
      aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="navbar-collapse collapse" id="navbarContent">
      <ul class="navbar-nav ml-auto">
        {% for link in site.data.navigation %}
        {% if page.group == link.group %}
        <li class="nav-item active"><a class="nav-link" href="{{link.link}}"> {{link.name}}<span
              class="sr-only">(current)</span></a></li>
        {% else %}
        <li class="nav-item"><a class="nav-link" href="{{link.link}}"> {{link.name}}</a></li>
        {% endif %}
        {% endfor %}
      </ul>
    </div><!--/.nav-collapse -->
  </nav>

  <div class="container">
